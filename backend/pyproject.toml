[project]
name = "flagpole-api"
version = "0.1.0"
description = "Flagpole feature-flag service API. Spec: 001-flagpole-api."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.19,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.13,<3",
  "psycopg[binary]>=3.2,<4",
  "prometheus-fastapi-instrumentator>=8.1,<9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.16",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app"]
