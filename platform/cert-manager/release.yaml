# cert-manager: issues the certificates Traefik serves. Spec: 005-platform-delivery FR-010 (E3).
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  # FR-006 requires a resource changed directly in the cluster to be put back. For a Kustomization
  # that is the default; for a HelmRelease it is NOT — without this, Flux reconciles the *release*
  # and leaves whatever the chart created alone, so `kubectl scale` on a chart's Deployment simply
  # sticks. Found by scaling Traefik by hand and watching nothing happen.
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart installs its own custom resources. The issuer Kustomization depends on this release,
    # so the CRDs exist before anything references them.
    crds:
      enabled: true
    replicaCount: 1
    securityContext:
      runAsNonRoot: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
