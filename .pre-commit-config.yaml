# Fast, local checks. Slow scanners (trivy, semgrep, osv-scanner) run via `make scan` and CI, not here.
# Renovate keeps the `rev` pins current (pre-commit manager enabled in renovate.json).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(deploy/|clusters/)  # SOPS-encrypted files are valid YAML but kustomize-only; checked by kustomize build in CI
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$  # tsconfig is JSONC: TypeScript allows comments, python json does not
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-S, warning]
        exclude: ^\.specify/   # generated by Spec Kit; refreshed by `specify init`, not ours to fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: sops-secrets
        name: every kind:Secret under deploy/ or clusters/ is SOPS-encrypted
        entry: scripts/check-sops-secrets.sh
        language: script
        files: ^(deploy|clusters)/.*\.ya?ml$
