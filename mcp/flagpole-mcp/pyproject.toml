[project]
name = "flagpole-mcp"
version = "0.1.0"
description = "MCP server over the Flagpole flag service. Spec: 004-flagpole-mcp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.1.1",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flagpole_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
