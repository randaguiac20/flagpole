# flagpole-web. Spec: 005-platform-delivery FR-001, FR-020.
#
# Single-page app: every path that is not a real file becomes index.html, so a deep link and a
# refresh both work. /healthz is answered here rather than by the app, because a probe must not
# depend on JavaScript running.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The runtime configuration is served from a writable path, not from the image: the container
    # runs with a read-only root filesystem, so the entrypoint has nowhere in /usr/share to write.
    # The copy shipped inside the image is therefore never served, which is the safer default —
    # a container started without FLAGPOLE_OIDC_ISSUER fails at startup instead of quietly serving
    # localhost values to a real deployment.
    #
    # Never cached: a stale copy would point a browser at the wrong identity provider.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        alias /tmp/flagpole/config.js;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # Hashed asset names, so these are safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
