<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flagpole consumer</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 16px/1.6 system-ui, sans-serif;
        margin: 0 auto; padding: 2rem 1.25rem; max-width: 46rem;
      }
      h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
      .banner {
        background: #1f4fd8; color: #fff; border-radius: 4px;
        padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-weight: 600;
      }
      .decision { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
      .decision th, .decision td { text-align: left; padding: 0.4rem 0.8rem 0.4rem 0; border-bottom: 1px solid #8883; }
      .decision th { font-weight: 600; width: 12rem; }
      code { font-family: ui-monospace, monospace; }
      .note { color: #6b7280; font-size: 0.9rem; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
